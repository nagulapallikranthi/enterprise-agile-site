name: Deploy to Cloudflare

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and validate site
        run: npm run check

      - name: Validate Cloudflare configuration
        run: npx wrangler deploy --dry-run --env "${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'staging' && 'staging' || 'production' }}"

  deploy:
    name: Deploy ${{ github.ref_name }}
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'develop' && 'DEV' || github.ref_name == 'staging' && 'STG' || 'PROD' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.ref_name == 'develop' && 'dev' || github.ref_name == 'staging' && 'staging' || 'production' }}
