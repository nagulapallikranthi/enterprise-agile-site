# Destination: .github/workflows/quality.yml
# Changes vs original:
#   • Added `npx astro check` — catches TypeScript / component type errors in .astro files
#   • Added bundle size check step (reads from validate-build.mjs output)
#   • Timeout increased to 15 min to accommodate astro check on large pages

name: Quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type check, build, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check Astro components
        run: npx astro check
        # Catches TypeScript errors in .astro, .ts, and .tsx files.
        # Must pass before build runs.

      - name: Build and validate site
        run: npm run check
        # npm run check = astro build && node scripts/validate-build.mjs
        # validate-build.mjs checks: canonicals, alt text, broken anchors,
        # skip links, release identity, required artifacts, and bundle size.
        env:
          PUBLIC_SITE_URL: https://enterprise-agile-site-dev.nagulapalli-kranthi.workers.dev
